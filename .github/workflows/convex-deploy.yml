name: Deploy Convex Backend

on:
  push:
    branches: [main]
    paths:
      - "convex/**"
      - "shared/**"
      - "package.json"
      - ".github/workflows/convex-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: node frontend/build.mjs
      - run: node tests/assessment.test.cjs
      - run: node tests/free-writing-sync.test.cjs
      - run: node tests/grammar-gateway.test.mjs
      - run: node tests/grammar-bridge.test.cjs
      - run: node tests/grammar-state.test.cjs
      - run: node tests/grammar-ui.test.cjs
      - run: node tests/rubric-audio.test.mjs
      - run: node tests/speaking-save.test.mjs
      - run: node tests/assessment-backend.test.cjs
      - run: node tests/assessment-worker.test.mjs
      - run: node tests/assessment-client.test.mjs
      - run: node tests/score-text.test.mjs
      - run: node tests/teacher-ticket.test.cjs
      - name: Deploy Convex Backend
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Configure outbound local assessor authentication
        if: success()
        run: |
          if [ -n "$ASSESSOR_WORKER_TOKEN" ]; then
            npx convex env set ASSESSOR_WORKER_TOKEN "$ASSESSOR_WORKER_TOKEN"
          fi
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          ASSESSOR_WORKER_TOKEN: ${{ secrets.ASSESSOR_WORKER_TOKEN }}
