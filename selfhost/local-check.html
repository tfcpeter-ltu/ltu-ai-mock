<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LTU 本機英文文法檢查</title><style>body{font:17px/1.7 system-ui,sans-serif;background:#f4f1e9;color:#19364b;max-width:960px;margin:auto;padding:28px}section{background:white;border:1px solid #cbd5db;border-radius:14px;padding:24px;margin:20px 0}textarea{box-sizing:border-box;width:100%;min-height:230px;font:17px/1.7 Georgia,serif;padding:14px;border:1px solid #8eacbe;border-radius:8px}button,select{font:inherit;padding:9px 14px;margin:8px 8px 8px 0}button{background:#164e70;color:white;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}li{padding:14px 0;border-bottom:1px solid #ddd}blockquote{margin:10px 0;padding-left:12px;border-left:3px solid #d0a655;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#4d6474}.status{min-height:28px}</style><h1>LTU 本機英文文法檢查</h1><p>這個測試頁只連到此電腦的 LanguageTool，不呼叫付費 AI API，也不把作文送往網站學習雲端。本頁不保存檢查歷史；複製修訂內容後再關閉頁面。</p><section><label for="language">語系</label> <select id="language"><option value="en-GB">英式英文</option><option value="en-US">美式英文</option></select><label for="essay" style="display:block">作文（最多 12000 字元）</label><textarea id="essay" maxlength="12000" spellcheck="false">She go to school every days. This are a test.</textarea><div><button id="check">檢查文法</button><button id="example">載入測試句子</button></div><div id="status" class="status" role="status"></div></section><section><h2>檢查建議</h2><p>這是拼寫、文法與標點規則檢查，不是雅思 Band 評分。建議可能誤判，請依原意確認；沒有偵測到問題也不代表作文已達高分。</p><div id="summary">尚未檢查</div><ol id="results"></ol></section><small>執行環境、記錄與金鑰留在此電腦的 LocalAppData；原始碼與版本清單保留在專案 OneDrive 資料夾。關機後本機服務停止，未設定開機自動啟動。</small><script>
const essay=document.querySelector('#essay'),status=document.querySelector('#status'),button=document.querySelector('#check'),results=document.querySelector('#results'),summary=document.querySelector('#summary');
document.querySelector('#example').onclick=()=>{essay.value='She go to school every days. This are a test.';results.replaceChildren();summary.textContent='已載入合成測試句子，請點選檢查。'};
essay.addEventListener('input',()=>{results.replaceChildren();summary.textContent='內容已變更，請重新檢查。'});
button.onclick=async()=>{
 const text=essay.value;if(!text.trim()){status.textContent='請輸入英文作文';return;}button.disabled=true;status.textContent='正在這台電腦檢查…';results.replaceChildren();
 try{const response=await fetch('/local-check',{method:'POST',headers:{'Content-Type':'application/json','X-LTU-Local-Check':'1'},body:JSON.stringify({text,language:document.querySelector('#language').value})});const data=await response.json();if(!response.ok)throw Error(data.error||'服務暫時無法使用');if(essay.value!==text){status.textContent='內容已變更，請重新檢查。';return;}summary.textContent='LanguageTool '+data.engineVersion+' · '+data.matches.length+' 項建議'+(data.truncated?'（最多顯示 60 項）':'');for(const item of data.matches){const row=document.createElement('li'),title=document.createElement('b'),quote=document.createElement('blockquote'),message=document.createElement('p'),suggestion=document.createElement('p');title.textContent=item.category+' · '+item.ruleId;quote.textContent=text.slice(Math.max(0,item.offset-30),item.offset+item.length+30);message.textContent=item.message;suggestion.textContent='可參考：'+(item.replacements.join(' / ')||'請依語境修訂');row.append(title,quote,message,suggestion);results.append(row);}status.textContent='本機檢查完成；未產生雅思分數。';}
 catch(e){status.textContent=e.message+'；原文仍保留。';}finally{button.disabled=false;}
};
</script></html>
